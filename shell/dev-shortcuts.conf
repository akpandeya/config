# dev shortcuts — one per line:
#
#   name = path-relative-to-code-root [: default-harness]
#
# The code root is $DEV_CODE_ROOT (default ~/code), so the path below
# resolves to ~/code/work/fulfilment-demand-allocator.
#
# What a shortcut gives you (using `fda` as the example):
#   fda      cd into the repo and launch its default harness.
#            The bare command is created when the shell starts, so after
#            adding a shortcut open a new terminal (or `source ~/.zshrc`).
#   cc fda   cd into the repo and launch Claude Code — works immediately,
#            no reload needed.
#   oc fda   cd into the repo and launch opencode — works immediately.
#   dev      shortcuts are pinned at the top of the fuzzy list, marked "*".
#
# default-harness is optional (`opencode` or `claude`); without it the bare
# command only cd's. Blank lines and lines starting with # are ignored.

fda = work/fulfilment-demand-allocator : opencode
